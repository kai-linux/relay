[project]
name = "relay"
version = "0.1.0"
description = "Voice bridge to CLI AI agents — voice in, voice out, work synced over git"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "quart>=0.19",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["static/**/*"]
